{% extends 'base.html' %}

{% block title %}Profile - CCMS{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 700px; margin: 0 auto;">
    <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 3rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 2rem;">
        <div style="width: 100px; height: 100px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700;">
            {{ current_user.username|first|upper }}
        </div>
        <div>
            <h2>{{ current_user.username }}</h2>
            <p style="color: var(--text-muted);">Member since {{ current_user.created_at.strftime('%d %b, %Y') }}</p>
        </div>
    </div>

    <form method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Email Address</label>
                <input type="email" name="email" value="{{ current_user.email }}" required style="width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; outline: none;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Phone Number</label>
                <input type="text" name="phone_number" value="{{ current_user.phone_number or '' }}" style="width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; outline: none;">
            </div>
        </div>
        <div style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Residential Address</label>
            <textarea name="address" rows="3" style="width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; outline: none; resize: vertical;">{{ current_user.address or '' }}</textarea>
        </div>
        <button type="submit" class="btn">Update Profile</button>
    </form>
</div>
{% endblock %}
