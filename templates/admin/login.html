{% extends 'base.html' %}

{% block title %}Admin Login - CCMS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 450px; border-top: 5px solid #FF9933;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-user-shield fa-4x" style="color: #FF9933; margin-bottom: 1rem;"></i>
            <h2 style="font-size: 2rem;">Admin Portal</h2>
            <p style="color: var(--text-muted);">Restricted Access - Administrators Only</p>
        </div>
        
        <form method="POST">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Admin Username</label>
                <input type="text" name="username" required style="width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 1.1rem;">
            </div>
            <div style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Admin Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 1.1rem;">
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 1rem; font-size: 1.2rem; background: linear-gradient(135deg, #FF9933, #cc7a29);">Authorize Access</button>
        </form>
        
        <div style="margin-top: 2rem; padding: 1rem; background: rgba(255, 153, 51, 0.05); border-radius: 12px; text-align: center;">
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                <i class="fas fa-info-circle"></i> Security logs are being recorded for this session.
            </p>
        </div>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            <a href="/" style="color: var(--text-muted); text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
        </p>
    </div>
</div>
{% endblock %}
